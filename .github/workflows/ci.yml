name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Rehearse the release artifacts
        if: matrix.java == '25'
        run: |
          mvn -B -ntp -P release package -Dgpg.skip=true -DskipTests -pl columnwire-core,columnwire-spring-boot-starter -am
          mkdir -p release
          cp columnwire-core/target/columnwire-core-*.jar columnwire-spring-boot-starter/target/columnwire-spring-boot-starter-*.jar release/
          cp LICENSE release/LICENSE
          for jar in release/*.jar; do
            case "$jar" in *-javadoc.jar) continue ;; esac
            unzip -l "$jar" | grep -q 'META-INF/LICENSE$' || { echo "$jar has no META-INF/LICENSE"; exit 1; }
          done
          ls -l release

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck -w columnwire
      - run: npm test
      - run: npm run build
      - run: npm run build -w columnwire-demo
      - name: Rehearse the npm release pack
        run: |
          mkdir -p ../release
          npm pack -w columnwire --pack-destination ../release
          ls -l ../release/columnwire-*.tgz
