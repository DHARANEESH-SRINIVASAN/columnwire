name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Encode the datasets with columnwire-core
        run: |
          mvn -B -ntp -pl columnwire-benchmark -am install -DskipTests
          cd columnwire-benchmark
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          java --add-opens=java.base/java.nio=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow \
            -cp "target/classes:$(cat target/cp.txt)" \
            io.github.dharaneeshsrinivasan.columnwire.benchmark.PayloadSizes ../js/demo/public/data 10000 100000 300000
          gzip -9 ../js/demo/public/data/*.arrow
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build the demo
        working-directory: js
        env:
          VITE_DATA_MODE: static
          VITE_BASE: /columnwire/
        run: |
          npm ci
          npm run build -w columnwire-demo
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: js/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
