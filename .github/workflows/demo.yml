name: Live demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Encode the datasets with columnwire-core
        run: |
          mvn -B -ntp -pl columnwire-benchmark -am install -DskipTests
          cd columnwire-benchmark
          mvn -B -ntp -q dependency:build-classpath -Dmdep.outputFile=target/cp.txt
          java --add-opens=java.base/java.nio=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow \
            -cp "target/classes:$(cat target/cp.txt)" \
            io.github.dharaneeshsrinivasan.columnwire.benchmark.PayloadSizes ../js/demo/public/data 10000 100000 300000
          gzip -9 ../js/demo/public/data/*.arrow
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Build the demo
        working-directory: js
        env:
          VITE_DATA_MODE: static
          VITE_BASE: /columnwire/
        run: |
          npm ci
          npm run build -w columnwire-demo
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: js/demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
