name: Bug report
description: Something behaves differently from the README
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The record type, the controller method, and the request with its Accept header.
      render: java
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: Columnwire 0.1.0, Spring Boot 4.1.2, JDK 21, apache-arrow 21.2.0, Chrome 142
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      render: text
